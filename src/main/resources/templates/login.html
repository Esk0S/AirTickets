<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Авторизация</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
    <link rel="manifest" href="/images/favicon/site.webmanifest">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <link href="/css/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <script type="text/javascript" src="/js/bootstrap/bootstrap.bundle.min.js" defer></script>
</head>
<body>

<div class="container mt-4">
    <h1 class="text-center mainText">Вход</h1>
    <form th:action="@{${loginUrl}}" method="post" class="w-50 mx-auto">
        <div class="mb-3">
            <label for="username" class="form-label">Имя пользователя:</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Пароль:</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary">Вход</button>
        </div>
    </form>

    <div class="text-center mt-3">
        <p>Нет аккаунта? <a th:href="@{${registerUrl}}">Зарегистрироваться</a></p>
    </div>
    <div th:if="${errorType == 'loginError'}" class="alert alert-danger mx-auto w-50 mt-3">
        <div th:utext="${customErrors['loginError']}"></div>
    </div>
</div>

</body>
</html>
