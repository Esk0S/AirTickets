<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
    <link rel="manifest" href="/images/favicon/site.webmanifest">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <script type="text/javascript" src="/js/script.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link href="/css/bootstrap/bootstrap.min.css" rel="stylesheet">
    <script type="text/javascript" src="/js/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="text/javascript" src="/js/axios/axios.min.js" defer></script>
    <title>Air Tickets</title>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-end">
        <a th:href="@{${isLoggedIn} ? ${logoutUrl} : ${loginUrl}}" class="text-decoration-none">
            <span th:text="${isLoggedIn} ? 'Выход' : 'Вход'"></span>
        </a>
    </div>
    <p class="mainText text-center">Поиск авиабилетов</p>
    <form id="ticketSearchForm">
        <div class="row justify-content-center">
            <div class="col-md-3 mb-2">
                <label class="mb-1" for="fromPlace">Откуда:</label>
                <input
                        name="fromPlace"
                        id="fromPlace"
                        class="form-control"
                        type="text"
                        autocomplete="off"
                        list="fromPlaceList"
                >
                <datalist id="fromPlaceList"></datalist>
            </div>
            <div class="col-md-3 mb-2">
                <label class="mb-1" for="toPlace">Куда:</label>
                <input
                        name="toPlace"
                        id="toPlace"
                        class="form-control"
                        type="text"
                        autocomplete="off"
                        list="toPlaceList"
                >
                <datalist id="toPlaceList"></datalist>
            </div>
            <div class="col-md-3 mb-2">
                <label class="mb-1" for="dateInput">Когда:</label>
                <input name="when" id="dateInput" class="form-control" type="date">
            </div>
        </div>

        <div class="text-center mt-3">
            <button
                    type="button"
                    class="btn btn-primary d-flex justify-content-center align-items-center searchButton"
                    id="searchButton"
            >
                Поиск
            </button>
        </div>
    </form>

    <div id="ticketsTable" class="mt-4"></div>
</div>

<script th:inline="javascript" type="text/javascript">
    const searchCitiesUrl = /*[[${searchCitiesUrl}]]*/ ''
    const searchTicketsUrl = /*[[${searchTicketsUrl}]]*/ ''
    const ticketPurchaseUrl = /*[[${ticketPurchaseUrl}]]*/ ''

    document.getElementById('fromPlace').addEventListener('input', function() {
        searchCities('fromPlace', 'fromPlaceList', searchCitiesUrl);
    });

    document.getElementById('toPlace').addEventListener('input', function() {
        searchCities('toPlace', 'toPlaceList', searchCitiesUrl);
    });

    document.getElementById('searchButton').addEventListener('click', function(event) {
        event.preventDefault();
        getTicketsTable(searchTicketsUrl);
    });

    window.ticketPurchaseUrl = ticketPurchaseUrl
</script>
</body>
</html>
