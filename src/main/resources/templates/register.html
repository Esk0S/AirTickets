<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/css/bootstrap/bootstrap.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <script type="text/javascript" src="/js/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="text/javascript" src="/js/axios.min.js"></script>
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center">Регистрация</h1>
    <form th:action="@{${signUpUrl}}" th:object="${userRegistrationRequest}" method="post">

        <div class="mb-3">
            <label for="username" class="form-label">Имя пользователя <span class="required-asterisk">*</span></label>
            <input type="text" id="username" name="username" class="form-control">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Пароль <span class="required-asterisk">*</span></label>
            <input type="password" id="password" name="password" class="form-control">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Электронная почта <span class="required-asterisk">*</span></label>
            <input type="email" id="email" name="email" class="form-control">
        </div>

        <div class="mb-3">
            <label for="firstName" class="form-label">Имя</label>
            <input type="text" id="firstName" name="firstName" class="form-control">
        </div>

        <div class="mb-3">
            <label for="lastName" class="form-label">Фамилия</label>
            <input type="text" id="lastName" name="lastName" class="form-control">
        </div>

        <div class="mb-3">
            <label for="middleName" class="form-label">Отчество</label>
            <input type="text" id="middleName" name="middleName" class="form-control">
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </div>

        <div th:if="${userRegistrationRequest != null and #fields.hasErrors()}" class="alert alert-danger mt-3">
            <ul>
                <li
                    th:if="${#fields.hasErrors('username')}"
                    th:each="error : ${#fields.errors('username')}"
                >
                    <div th:utext="${error}"></div>
                </li>
                <li
                    th:if="${#fields.hasErrors('password')}"
                    th:each="error : ${#fields.errors('password')}"
                >
                    <div th:utext="${error}"></div>
                </li>
                <li
                    th:if="${#fields.hasErrors('email')}"
                    th:each="error : ${#fields.errors('email')}"
                >
                    <div th:utext="${error}"></div>
                </li>
                <li
                    th:if="${#fields.hasErrors('firstName')}"
                    th:each="error : ${#fields.errors('firstName')}"
                >
                    <div th:utext="${error}"></div>
                </li>
                <li
                    th:if="${#fields.hasErrors('lastName')}"
                    th:each="error : ${#fields.errors('lastName')}"
                >
                    <div th:utext="${error}"></div>
                </li>
                <li
                    th:if="${#fields.hasErrors('middleName')}"
                    th:each="error : ${#fields.errors('middleName')}"
                >
                    <div th:utext="${error}"></div>
                </li>
            </ul>
        </div>

    </form>
</div>

</body>
</html>
