databaseChangeLog:
  - changeSet:
      id: 4
      author: EskoS
      changes:
        - createTable:
            tableName: purchase
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: bigint
              - column:
                  name: ticket_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: middle_name
                  type: varchar(30)
              - column:
                  name: birth_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: passport_number
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: with_baggage
                  type: bool
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: purchase
            baseColumnNames: user_id
            referencedTableName: "user"
            referencedColumnNames: id
            constraintName: fk_purchase_user

        - addForeignKeyConstraint:
            baseTableName: purchase
            baseColumnNames: ticket_id
            referencedTableName: ticket
            referencedColumnNames: id
            constraintName: fk_purchase_ticket